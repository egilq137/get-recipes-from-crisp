[project]
name = "crisp-recipes"
version = "0.2.0"
description = "Scrape the weekly crisp.nl box, translate it, add USDA nutrition facts, and email it"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepl>=1.30.0",
    "fpdf2>=2.8.0",
    "google-genai>=1.75.0",
    "playwright>=1.59.0",
    "python-dotenv>=1.2.2",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
crisp-recipes = "crisp_recipes.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crisp_recipes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
