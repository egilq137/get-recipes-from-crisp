name: Weekly recipes

on:
  schedule:
    # Wednesday 07:00 UTC — crisp.nl has published the coming week's box by then,
    # leaving time to plan before delivery.
    - cron: "0 7 * * 3"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

# Avoid two runs overlapping if a manual run is triggered near the schedule.
concurrency:
  group: weekly-recipes
  cancel-in-progress: false

# Pushes the recipe website to the gh-pages branch.
permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    # Generous headroom: apt (Firefox's OS-level deps: fonts, codec libs) is fetched
    # fresh from Ubuntu's mirror on every run since GitHub-hosted runners don't persist
    # OS state between runs, and that mirror is occasionally slow (individual small
    # packages have been observed taking minutes). The retry loop below handles a truly
    # stuck attempt; this ceiling just gives a slow-but-progressing mirror room to finish.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Playwright Firefox
        # apt's mirror occasionally stalls on individual packages (observed: several
        # minutes for a single few-MB file). Retry a few times with a per-attempt
        # timeout rather than let one stuck download consume the whole job budget.
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt..."
            if timeout 12m uv run playwright install --with-deps firefox; then
              exit 0
            fi
            echo "Attempt $attempt failed or timed out; retrying..."
            sleep 15
          done
          echo "All attempts failed."
          exit 1

      - name: Check out the recipe site (gh-pages branch)
        # Past weeks live on gh-pages; the pipeline adds this week next to them.
        # The first run creates the branch.
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git worktree add -B gh-pages site FETCH_HEAD
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Run the pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          # Optional overrides (safe to leave unset):
          CRISP_BOX: ${{ vars.CRISP_BOX }}
          TARGET_PORTIONS: ${{ vars.TARGET_PORTIONS }}
          SITE_DIR: site
          RATINGS_API_URL: ${{ vars.RATINGS_API_URL }}
        run: uv run python -m crisp_recipes

      - name: Publish the recipe site
        # Runs even if the email failed, so the site still gets the week.
        if: always()
        working-directory: site
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No site changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]"               -c user.email="41898282+github-actions[bot]@users.noreply.github.com"               commit -m "Recipes for $(date -u +%G-W%V)"
          git push origin gh-pages

      - name: Upload generated PDFs
        # Keeps a copy in the run's artifacts even if the email fails to send.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipes
          path: recipes/
          if-no-files-found: ignore
          retention-days: 30
