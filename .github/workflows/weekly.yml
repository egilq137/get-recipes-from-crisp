name: Weekly recipes

on:
  schedule:
    # Wednesday 07:00 UTC — crisp.nl has published the coming week's box by then,
    # leaving time to plan before delivery.
    - cron: "0 7 * * 3"
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

# Avoid two runs overlapping if a manual run is triggered near the schedule.
concurrency:
  group: weekly-recipes
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    # Generous headroom: apt (Firefox's OS-level deps: fonts, codec libs) is fetched
    # fresh from Ubuntu's mirror on every run since GitHub-hosted runners don't persist
    # OS state between runs, and that mirror is occasionally slow (individual small
    # packages have been observed taking minutes). The retry loop below handles a truly
    # stuck attempt; this ceiling just gives a slow-but-progressing mirror room to finish.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache Playwright browser binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Firefox system dependencies
        # Two failure modes have bitten this step, both fixed here:
        #
        # 1. The azure.archive.ubuntu.com mirror intermittently stops responding
        #    ("Ign:" on every index), so apt-get update hangs indefinitely. We point
        #    apt at archive.ubuntu.com, which kept working in the same runs where the
        #    Azure mirror was being ignored.
        # 2. A plain `timeout` only signals its direct child. The chain here is
        #    timeout -> playwright -> sudo -> apt-get, and sudo does not forward the
        #    signal to the root-owned apt-get, so the killed attempt left an orphan
        #    holding /var/lib/apt/lists/lock and every later retry died on the lock in
        #    under a second. Running timeout under sudo with --signal=KILL, plus
        #    clearing stale locks, makes the retries actually independent.
        run: |
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources || true
          for attempt in 1 2 3; do
            echo "apt-get update attempt $attempt..."
            sudo timeout --signal=KILL 4m apt-get update && break
            echo "apt-get update stalled; clearing locks before retry."
            sudo pkill -9 -x apt-get || true
            sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend
            sleep 15
          done
          uv run playwright install-deps firefox

      - name: Install Playwright Firefox
        # Separate from the apt work above: on a cache hit this is a no-op, so a slow
        # mirror can no longer block a browser that is already on disk.
        run: uv run playwright install firefox

      - name: Run the pipeline
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          # Optional overrides (safe to leave unset):
          CRISP_BOX: ${{ vars.CRISP_BOX }}
          TARGET_PORTIONS: ${{ vars.TARGET_PORTIONS }}
        run: uv run python -m crisp_recipes

      - name: Upload generated PDFs
        # Keeps a copy in the run's artifacts even if the email fails to send.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recipes
          path: recipes/
          if-no-files-found: ignore
          retention-days: 30
