<main>
  <h1>Caramelised fennel with creamy mash, lentils, yellow cabbage and flaked almonds</h1>
  <p class="muted">Week 47, 2026 · 30 min active · ~65 min realistic (incl. prep) · 4 servings</p>

  <section><h2>Ingredients</h2><ul class="ingredients"><li><label><input type="checkbox"><span></span></label></li><li><label><input type="checkbox"><span>600 g Doré potatoes</span></label></li><li><label><input type="checkbox"><span>400 g parsley root</span></label></li><li><label><input type="checkbox"><span>2 fennel</span></label></li><li><label><input type="checkbox"><span>1 lemon</span></label></li><li><label><input type="checkbox"><span>600 g yellow cabbage (Bloemendaal variety)</span></label></li><li><label><input type="checkbox"><span>1 pack lentils</span></label></li><li><label><input type="checkbox"><span>40 g almond flakes</span></label></li><li><label><input type="checkbox"><span>1 bunch parsley</span></label></li><li><label><input type="checkbox"><span>Oil for frying (pantry)</span></label></li><li><label><input type="checkbox"><span>60 g vegan butter (for the fennel) (pantry)</span></label></li><li><label><input type="checkbox"><span>1 tsp thyme (dried) (pantry)</span></label></li><li><label><input type="checkbox"><span>2 clove garlic (pantry)</span></label></li></ul></section>

  <section><h2>Preparation</h2>
    <p class="muted">Amounts in the steps are for 2 servings, as on crisp.nl.</p>
    <p class="muted hint">Tap a step when it's done.</p>
    <ol class="steps"><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 1</span><span class="txt">Peel 300 g of potatoes and 200 g of root parsley and cut them into pieces, with the root parsley cut slightly smaller than the potatoes. Cook in a little salted water for about 15 minutes until tender.</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 2</span><span class="txt">Heat the oil in a large frying pan. Remove the base and fronds from the fennel and cut it into wedges. Fry the wedges on both sides until nicely browned. Once browned, add the 30 g of vegan butter, along with salt and ½ tsp of dried thyme, and continue frying. Note: Use the largest fennel from the box for this recipe.</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 3</span><span class="txt">Grate ½ a lemon (set aside) and squeeze the juice into a small bowl. Deglaze the fennel with a small splash of the lemon juice and fry for a few more minutes until well cooked. Once the fennel pieces are al dente (test with a fork), place them on a small plate.</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 4</span><span class="txt">Cut 300 g of yellow cabbage into strips. If necessary, add another knob of vegan butter to the pan. Fry the yellow cabbage for a few minutes. Finely chop 1 clove of garlic and fry it briefly with the cabbage. Drain ½ a packet of lentils, add them to the pan and heat through for a few minutes.</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 5</span><span class="txt">Drain the potatoes and root parsley (keep some of the cooking liquid!). Mash as finely as possible. Make it nice and creamy with a bit of the cooking liquid and a generous knob of vegan butter. Season to taste with salt and pepper.</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 6</span><span class="txt">Toast 20 g of flaked almonds in a small, dry frying pan until they start to brown. This can happen quickly, so keep an eye on them.</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 7</span><span class="txt">Add the lemon zest to the lentils and cabbage and season to taste with salt, pepper and a further approx. 0.5 tbsp (for 2 people) of lemon juice. Place the fennel segments back on top and heat through briefly.</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 8</span><span class="txt">Finely chop ½ bunch of parsley (including the thin stalks).</span></button></li><li><button type="button" class="step" aria-pressed="false"><span class="num">Step 9</span><span class="txt">Serve the mashed potatoes topped with the lentils, yellow cabbage and fennel. Garnish with the flaked almonds and parsley.</span></button></li></ol>
  </section>
